name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build both applications
        run: npm run build
        env:
          BASE_PATH: /Aeroscribe/

  api:
    name: API (typecheck, tests, synthetic CFD smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck the service
        run: npx tsc --noEmit -p services/api/tsconfig.json

      # Hermetic: no network, no solver binary, temporary data directories.
      - name: Test the service
        run: npx vitest run services/api

      # Proves the CFD path and the GCI acceptance gates run in a bare container.
      - name: Synthetic CFD smoke test
        run: npm run smoke:cfd
        env:
          AEROSCRIBE_DATA_DIR: ${{ runner.temp }}/aeroscribe-data
