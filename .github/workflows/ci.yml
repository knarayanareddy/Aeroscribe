name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Coverage is the same run plus thresholds, so it replaces `npm test`
      # rather than repeating it. The thresholds encode RULE-050.
      - name: Test with coverage thresholds
        run: npm run coverage

      # `npm run build` ends with scripts/check-bundle-secrets.mjs, which fails
      # the job if a secret — or a non-VITE_ environment read in client code —
      # reached the bundle.
      - name: Build both applications and check the bundle
        run: npm run build
        env:
          BASE_PATH: /Aeroscribe/

  api:
    name: API (typecheck, tests, synthetic CFD smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck the service
        run: npx tsc --noEmit -p services/api/tsconfig.json

      # Hermetic: no network, no solver binary, temporary data directories.
      - name: Test the service
        run: npx vitest run services/api

      # Proves the CFD path and the GCI acceptance gates run in a bare container.
      - name: Synthetic CFD smoke test
        run: npm run smoke:cfd
        env:
          AEROSCRIBE_DATA_DIR: ${{ runner.temp }}/aeroscribe-data

  # The Dockerfile is the deployment artefact; building it here keeps it from
  # rotting. The runtime install is `--omit=dev`, so this also fails if a
  # package the service needs at runtime is sitting in devDependencies.
  api-image:
    name: API image builds and answers /health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t aeroscribe-api:ci .

      - name: Boot it and wait for /health
        run: |
          docker run -d --name api -p 8787:8787 \
            -e AEROSCRIBE_OFFLINE=true \
            -e AEROSCRIBE_DATA_DIR=/data \
            aeroscribe-api:ci
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8787/health > /dev/null; then
              echo "healthy after ${attempt}s"
              curl -fsS http://127.0.0.1:8787/health
              exit 0
            fi
            sleep 1
          done
          echo "the container never answered /health"
          docker logs api
          exit 1

      - name: Container logs
        if: always()
        run: docker logs api || true

      - name: Remove the container
        if: always()
        run: docker rm -f api || true
