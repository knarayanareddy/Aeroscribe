name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    # Covers the service's store and coordination tests too: Postgres starts from
    # the embedded binaries, and Redis comes from the service below. Twenty
    # minutes is generous against the ~8 minutes this took before D2.
    timeout-minutes: 20
    services:
      # The Redis coordinator is only exercised against a real server: a shared
      # budget and a cross-instance lock are the behaviours under test, and a
      # double would prove only that the double works.
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AEROSCRIBE_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Coverage is the same run plus thresholds, so it replaces `npm test`
      # rather than repeating it. The thresholds encode RULE-050.
      - name: Test with coverage thresholds
        run: npm run coverage

      # `npm run build` ends with scripts/check-bundle-secrets.mjs, which fails
      # the job if a secret — or a non-VITE_ environment read in client code —
      # reached the bundle.
      - name: Build both applications and check the bundle
        run: npm run build
        env:
          BASE_PATH: /Aeroscribe/

  api:
    name: API (typecheck, tests, synthetic CFD smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AEROSCRIBE_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck the service
        run: npx tsc --noEmit -p services/api/tsconfig.json

      # The store tests need a real Postgres: advisory locks, triggers and
      # `jsonb` round-trips are the behaviour under test, so a double would
      # prove only that the double works. `embedded-postgres` ships genuine
      # server binaries as optional dependencies, which `npm ci` has already
      # installed — no service container, no daemon. `AEROSCRIBE_TEST_DATABASE_URL`
      # points the same harness at a managed server when one is available.
      - name: Check the bundled Postgres binaries
        run: |
          ls node_modules/@embedded-postgres/
          test -x "$(find node_modules/@embedded-postgres -name postgres -type f | head -1)"

      # Redis has no such package, so the coordination tests take the service
      # container above. A silent skip here would hide a real failure, so the
      # job asserts the variable arrived and the suite did not skip.
      - name: Check the Redis fixture is reachable
        run: |
          node -e "const net=require('node:net');const s=net.connect(6379,'127.0.0.1',()=>{s.end();console.log('redis reachable')});s.on('error',e=>{console.error(e.message);process.exit(1)})"

      # Hermetic otherwise: no network, no solver binary, temporary data directories.
      - name: Test the service
        run: npx vitest run services/api

      # Proves the CFD path and the GCI acceptance gates run in a bare container.
      - name: Synthetic CFD smoke test
        run: npm run smoke:cfd
        env:
          AEROSCRIBE_DATA_DIR: ${{ runner.temp }}/aeroscribe-data

  # Typesetting has two honest outcomes, and the suite covers both: without an
  # engine the run records `typeset: "source-only"` and blocks stage 8; with one
  # it records the toolchain version and a PDF whose hash the API serves. This
  # job installs a real engine so the second path is exercised in CI rather than
  # only on a machine that happens to have TeX.
  latex:
    name: LaTeX (install TeX, require a PDF)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install a TeX engine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-pictures

      - name: Typeset the manuscript
        run: npm run smoke:latex -- --require-pdf
        env:
          LATEX_BINARY: /usr/bin/pdflatex
          AEROSCRIBE_DATA_DIR: ${{ runner.temp }}/aeroscribe-data

  # Without an engine the same script must still write the source and say why
  # the PDF is missing — a silent success here would be a lie.
  latex-without-engine:
    name: LaTeX (no engine, source-only is reported)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write the source and report the blocker
        run: npm run smoke:latex
        env:
          AEROSCRIBE_DATA_DIR: ${{ runner.temp }}/aeroscribe-data

  # The Dockerfile is the deployment artefact; building it here keeps it from
  # rotting. The runtime install is `--omit=dev`, so this also fails if a
  # package the service needs at runtime is sitting in devDependencies.
  api-image:
    name: API image builds and answers /health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t aeroscribe-api:ci .

      - name: Boot it and wait for /health
        run: |
          docker run -d --name api -p 8787:8787 \
            -e AEROSCRIBE_OFFLINE=true \
            -e AEROSCRIBE_DATA_DIR=/data \
            aeroscribe-api:ci
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8787/health > /dev/null; then
              echo "healthy after ${attempt}s"
              curl -fsS http://127.0.0.1:8787/health
              exit 0
            fi
            sleep 1
          done
          echo "the container never answered /health"
          docker logs api
          exit 1

      - name: Container logs
        if: always()
        run: docker logs api || true

      - name: Remove the container
        if: always()
        run: docker rm -f api || true
